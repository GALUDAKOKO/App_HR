services:
  - type: web
    name: head-office-zl
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: RENDER
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./hr_data.db
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
